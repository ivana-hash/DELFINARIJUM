<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kupovina karata | Delfinarijum</title>
<style>
        @font-face {
            font-family: mojfont;
            src: url(./ShadowsIntoLight-Regular.ttf);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: beige;
            font-family: Verdana, sans-serif;
            color: rgb(40, 40, 40);
        }

        .forma {
            width: 100%;
            max-width: 600px;
            margin: 20px;
            padding: 25px;
            background-color: #98d1e1;
            border: 3px solid rgb(130, 206, 238);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
            color: rgb(13, 13, 156);
            font-family: mojfont, cursive;
            font-size: 40px;
        }

        /* jedno polje forme: natpis + unos */
        .polje {
            margin-bottom: 18px;
        }

        label, .oznaka {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
            color: rgb(13, 13, 156);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 15px;
            background-color: white;
        }

        input:focus, select:focus, textarea:focus {
            outline: 3px solid orange;
        }

        /* Musko / Zensko u jednom redu */
        .gender-group {
            display: flex;
            gap: 25px;
        }

        .gender-group label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0;
            font-weight: normal;
            color: rgb(40, 40, 40);
            cursor: pointer;
        }

        /* kruzici ne smeju da budu siroki 100% kao ostala polja */
        input[type="radio"] {
            width: auto;
            padding: 0;
        }

        .dugmad {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .dugme {
            flex: 1;
            padding: 12px;
            border: 2px solid rgb(13, 13, 156);
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .kupi {
            background-color: rgb(13, 13, 156);
            color: white;
        }

        .kupi:hover {
            background-color: rgb(38, 11, 213);
        }

        .odustani {
            background-color: white;
            color: rgb(13, 13, 156);
        }

        .odustani:hover {
            background-color: beige;
        }

        /* poruka posle uspesne kupovine */
        #poruka {
            text-align: center;
            line-height: 1.7;
        }

        #poruka p {
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .gender-group {
                flex-direction: column;
                gap: 10px;
            }

            .dugmad {
                flex-direction: column;
            }
        }
</style>
</head>
<body>

<div class="forma">
    <h1>Kupovina karata</h1>

    <form id="kupovina">
        <div class="polje">
            <label for="imePrez">Ime i prezime</label>
            <input type="text" id="imePrez" name="imePrezime" required placeholder="Unesite vaše ime i prezime">
        </div>

        <div class="polje">
            <label for="email">Email adresa</label>
            <input type="email" id="email" name="email" required placeholder="Unesite email adresu">
        </div>

        <div class="polje">
            <span class="oznaka">Pol</span>
            <div class="gender-group">
                <label>
                    <input type="radio" name="gender" value="male" required>
                    Muško
                </label>
                <label>
                    <input type="radio" name="gender" value="female" required>
                    Žensko
                </label>
            </div>
        </div>

        <div class="polje">
            <label for="tickets">Broj karata</label>
            <select id="tickets" name="tickets" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <div class="polje">
            <label for="godine">Koliko godina imate?</label>
            <select id="godine" name="godine" required>
                <option value="1">manje od 12 godina</option>
                <option value="2">12-18</option>
                <option value="3">više od 18 godina</option>
            </select>
        </div>

        <div class="polje">
            <label for="komentar">Napomena</label>
            <textarea id="komentar" name="comments" rows="4" placeholder="Unesite dodatne informacije (opciono)"></textarea>
        </div>

        <div class="dugmad">
            <button class="dugme kupi" type="submit">Kupi karte</button>
            <a class="dugme odustani" href="./index.html">Odustani</a>
        </div>
    </form>

    <!-- prikazuje se umesto forme kad kupovina uspe -->
    <div id="poruka" hidden>
        <p id="poruka-tekst"></p>
        <a class="dugme kupi" href="./index.html">Nazad na početnu</a>
    </div>
</div>

<script>
    let forma = document.getElementById("kupovina");
    let poruka = document.getElementById("poruka");
    let porukaTekst = document.getElementById("poruka-tekst");

    forma.addEventListener("submit", function (e) {
        // ne salji formu i ne osvezavaj stranicu
        e.preventDefault();

        let ime = document.getElementById("imePrez").value.trim();
        let mejl = document.getElementById("email").value.trim();
        let brojKarata = document.getElementById("tickets").value;

        // ime sastavljeno samo od razmaka ne vazi
        if (ime == "") {
            document.getElementById("imePrez").value = "";
            document.getElementById("imePrez").focus();
            return;
        }

        // 1 kartu, 2-4 karte, 5 karata
        let rec = "karte";
        if (brojKarata == "1") {
            rec = "kartu";
        } else if (brojKarata == "5") {
            rec = "karata";
        }

        porukaTekst.textContent =
            "Hvala, " + ime + "! Uspešno ste kupili " + brojKarata + " " + rec +
            ". Potvrda stiže na adresu " + mejl + ".";

        forma.hidden = true;
        poruka.hidden = false;
    });
</script>

</body>
</html>
