<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacija | Delfinarijum</title>
<style>

  html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

body{
    margin: 0;
    overflow: hidden;   /* sakriva ono sto ispliva van ekrana, da ne bude skrola */
}

#nebo{
    margin: 0;
    height: 100%;
    background-image: linear-gradient(to bottom, #accad6 0%, rgb(57, 212, 243), #74a3c9 40%,rgb(11, 11, 177) 45%,rgb(20, 183, 208));
    background-size: cover;
}

/* ---------- link za povratak ---------- */
.nazad{
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    padding: 8px 16px;
    background-color: rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    color: rgb(13, 13, 156);
    font-family: Verdana, sans-serif;
    font-weight: bold;
    text-decoration: none;
}
.nazad:hover{
    background-color: #98d1e1;
}

/* ---------- sunce: sjaj pulsira, sunce se blago njise ---------- */
#sunce{
    background-image: radial-gradient(circle,yellow, #e77d1f 90%);
    border-radius: 50%;
    position: absolute;
    top: 5%;
    right: 10%;
    width: 150px;
    height: 150px;
    box-shadow: 0 0 20px 20px rgba(255, 204, 0, 0.6);
    animation: sunce-sjaj 4s ease-in-out infinite;
}
@keyframes sunce-sjaj{
    0%, 100% { box-shadow: 0 0 20px 20px rgba(255, 204, 0, 0.6); transform: translateY(0); }
    50%      { box-shadow: 0 0 45px 40px rgba(255, 204, 0, 0.8); transform: translateY(-12px); }
}

/* ---------- oblaci: plove sleva nadesno ---------- */
.oblak{
    position: absolute;
    left: 0;
    width: 160px;
    height: 50px;
    background-color: white;
    border-radius: 50px;
    opacity: 0.9;
    animation: oblak-plovi linear infinite;
}
.oblak::before, .oblak::after{
    content: "";
    position: absolute;
    background-color: white;
    border-radius: 50%;
}
.oblak::before{ width: 70px; height: 70px; top: -35px; left: 22px; }
.oblak::after { width: 90px; height: 90px; top: -50px; left: 62px; }

#oblak1{ top: 12%; animation-duration: 60s; animation-delay: -10s; }
#oblak2{ top: 24%; animation-duration: 85s; animation-delay: -50s; transform-origin: left; scale: 0.7; }
#oblak3{ top: 7%;  animation-duration: 110s; animation-delay: -80s; scale: 0.5; }

@keyframes oblak-plovi{
    from { translate: -300px 0; }
    to   { translate: 100vw 0; }
}

/* ---------- talasi na liniji mora: dve trake koje klize u stranu ---------- */
.talasi{
    position: absolute;
    left: 0;
    width: 100%;
    height: 30px;
    background-repeat: repeat-x;
    background-size: 80px 30px;
    animation: talasi-klize linear infinite;
}
#talasi1{
    top: calc(45% - 34px);
    background-image: radial-gradient(circle at 50% 100%, rgb(60, 110, 215) 68%, transparent 70%);
    animation-duration: 9s;
    animation-direction: reverse;
}
#talasi2{
    top: calc(45% - 22px);
    background-image: radial-gradient(circle at 50% 100%, rgb(11, 11, 177) 68%, transparent 70%);
    animation-duration: 5s;
}
@keyframes talasi-klize{
    from { background-position-x: 0; }
    to   { background-position-x: 80px; }
}

/* ---------- delfini: na istim mestima kao ranije ---------- */
#gif{
    position: absolute;
    bottom: 30%;
    right: 10%;
    width: 200px;
    height: auto;
}
#gif2{
    position: absolute;
    bottom: 30%;
    left: 10%;
    width: 200px;
    height: auto;
}
#gif3{
    position: absolute;
    bottom: 50%;
    left: 30%;
    width: 200px;
    height: auto;
}

/* ---------- ribe: plivaju preko celog ekrana ---------- */
#ribe{
    position: absolute;
    bottom: 10%;
    left: 0;
    width: 200px;
    height: auto;
    animation: ribe-desno 28s linear infinite;
    animation-delay: -8s;
}
#ribe2{
    position: absolute;
    bottom: 5%;
    left: 0;
    width: 200px;
    height: auto;
    animation: ribe-levo 40s linear infinite;
    animation-delay: -15s;
}

/* Ako neka riba pliva unazad (repom napred), u njenoj animaciji
   zameni scaleX(1) sa scaleX(-1), ili obrnuto. */
@keyframes ribe-desno{
    from { transform: translateX(-220px) scaleX(1); }
    to   { transform: translateX(100vw) scaleX(1); }
}
@keyframes ribe-levo{
    from { transform: translateX(100vw) scaleX(-1); }
    to   { transform: translateX(-220px) scaleX(-1); }
}
</style>

</head>
<body>
    <a class="nazad" href="./index.html">&larr; Nazad na početnu</a>

    <div id="nebo"></div>
    <div id="sunce"></div>

    <div class="oblak" id="oblak1"></div>
    <div class="oblak" id="oblak2"></div>
    <div class="oblak" id="oblak3"></div>

    <div class="talasi" id="talasi1"></div>
    <div class="talasi" id="talasi2"></div>

    <img id="gif" src="./gif.gif" alt="Delfin koji skače">
    <img id="gif2" src="./gif.gif" alt="Delfin koji skače">
    <img id="gif3" src="./gif.gif" alt="Delfin koji skače">
    <img id="ribe" src="./ribe.gif" alt="Ribe">
    <img id="ribe2" src="./ribe.gif" alt="Ribe">
</body>
</html>
